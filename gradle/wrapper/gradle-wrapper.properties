# Posizione base della cache delle distribuzioni Gradle.
distributionBase=GRADLE_USER_HOME
# Sottocartella nella quale estrarre le distribuzioni scaricate.
distributionPath=wrapper/dists
# Distribuzione Gradle usata dal Wrapper del progetto.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.0-bin.zip
# Timeout delle operazioni di rete del Wrapper, in millisecondi.
networkTimeout=10000
# Abilita la verifica dell’URL della distribuzione.
validateDistributionUrl=true
# Posizione base della cache degli archivi ZIP delle distribuzioni.
zipStoreBase=GRADLE_USER_HOME
# Sottocartella degli archivi ZIP scaricati.
zipStorePath=wrapper/dists
